<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Giới thiệu - Website Của Chúng tôi</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="fade-in">
<header>
    <h1>Giới thiệu</h1>
    <nav>
        <a href="index.html">Trang chủ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="contact.html">Liên hệ</a>
    </nav>
</header>
<main>
    <section>
        <h2>Về chúng tôi</h2>
        <p>Chúng tôi là một nhóm đam mê công nghệ, thiết kế và chia sẻ kiến thức thông qua website này. Mục tiêu của chúng tôi là mang đến trải nghiệm học tập và kết nối tốt nhất cho mọi người.</p>
    </section>
</main>
<footer>
    <p>&copy; 2025 - Thiết kế bởi Chúng tôi.</p>
    <div>
        <a href="https://www.facebook.com/vuong.to.9235" target="_blank"><i class="fab fa-facebook fa-2x"></i></a>
        <a href="https://www.instagram.com/vug.to17/" target="_blank"><i class="fab fa-instagram fa-2x"></i></a>
        <a href="https://github.com/vuongto1910" target="_blank"><i class="fab fa-github fa-2x"></i></a>
    </div>
</footer>

<script>
    document.body.classList.add('fade-in');

    const links = document.querySelectorAll('a[href]');
    for (const link of links) {
        if (link.hostname === window.location.hostname) {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                document.body.classList.remove('fade-in');
                document.body.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = href;
                }, 500);
            });
        }
    }
</script>
</body>
</html>
